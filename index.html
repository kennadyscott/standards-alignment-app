<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standards Alignment — ClearK12</title>
<link rel="icon" href="favicon.svg?v=202608272307" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg?v=202608272307">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202608272307">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div>
      <div class="brand-name">Standards Alignment</div>
      <div class="brand-sub">ClearK12</div>
    </div>
  </div>
  <nav class="tabs" id="navTabs" role="tablist" aria-label="Main">
    <button class="tab active" role="tab" aria-selected="true" aria-controls="explorerView" id="tab-explorer" data-view="explorer" tabindex="0" title="Explorer">Explorer</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="reviewView" id="tab-review" data-view="review" tabindex="-1" title="Review Queue">Review <span class="badge" id="pendingBadge">0</span></button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="passagesView" id="tab-passages" data-view="passages" tabindex="-1" title="Master Passage List">Passages</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="inputView" id="tab-input" data-view="input" tabindex="-1" title="State Lists">Lists</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="dashView" id="tab-dash" data-view="dash" tabindex="-1" title="Dashboard">Dashboard</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="botsView" id="tab-bots" data-view="bots" tabindex="-1" title="Morning Board">Board <span class="badge" id="botsBadge">0</span></button>
  </nav>
  <div class="topbar-actions">
    <button class="btn btn-ghost hidden" id="saveBadge" title="Cloud saving status — click to connect or update the access token"></button>
    <button class="btn btn-ghost" id="exportBtn" title="Download approved alignments as JSON">Export</button>
  </div>
</header>

<main id="explorerView" class="view" role="tabpanel" aria-labelledby="tab-explorer">
  <aside class="picker-panel">
    <div class="picker-group">
      <label>State</label>
      <select id="stateSeg" class="ps-input"></select>
    </div>
    <div class="picker-group">
      <label>Subject</label>
      <div class="seg" id="subjectSeg">
        <button class="seg-btn active" data-val="social_studies">Social Studies</button>
        <button class="seg-btn" data-val="science">Science</button>
        <button class="seg-btn" data-val="ela">ELAR</button>
      </div>
    </div>
    <div class="picker-group">
      <label>Grade</label>
      <div class="grade-row" id="gradeRow"></div>
    </div>
    <div class="picker-group">
      <label>Standards <span class="count-pill" id="stdCount"></span></label>
      <input type="search" id="stdSearch" placeholder="Filter standards…">
      <div class="std-list" id="stdList"></div>
    </div>
  </aside>

  <section class="detail-panel" id="detailPanel">
    <div class="compare-bar" id="expCompareBar"></div>
    <div class="empty-state" id="emptyDetail">
      <div class="empty-icon" aria-hidden="true"></div>
      <h2>Select a standard</h2>
      <p id="emptyCompareCopy">Pick a standard on the left to compare it with another state.</p>
    </div>
    <div id="detailContent" class="hidden"></div>
  </section>
</main>

<main id="reviewView" class="view hidden" role="tabpanel" aria-labelledby="tab-review">
  <div class="review-header">
    <div class="review-filters">
      <div class="seg" id="revSubjectSeg">
        <button class="seg-btn active" data-val="social_studies">Social Studies</button>
        <button class="seg-btn" data-val="science">Science</button>
        <button class="seg-btn" data-val="ela">ELAR</button>
      </div>
      <div class="grade-row" id="revGradeRow"></div>
      <select id="revStateSeg" class="ps-input" style="max-width:180px"></select>
      <div class="seg" id="revStatusSeg">
        <button class="seg-btn active" data-val="pending">Pending</button>
        <button class="seg-btn" data-val="approved">Approved</button>
        <button class="seg-btn" data-val="rejected">Rejected</button>
        <button class="seg-btn" data-val="all">All</button>
      </div>
    </div>
    <div class="review-progress" id="reviewProgress"></div>
    <div class="kb-hint" title="Keyboard shortcuts for this queue">
      <kbd>J</kbd><kbd>K</kbd> move
      <kbd>A</kbd> approve
      <kbd>R</kbd> reject
      <kbd>U</kbd> undo
      <kbd>N</kbd> no alignment
    </div>
  </div>
  <div class="review-list" id="reviewList"></div>
</main>

<main id="passagesView" class="view hidden" role="tabpanel" aria-labelledby="tab-passages">
  <aside class="sets-panel">
    <div class="set-actions">
      <button class="btn btn-primary" id="newSetBtn" title="Create a new passage set">New set</button>
      <button class="btn btn-primary" id="genSetBtn" title="Generate a complete passage set from a state standard">Generate</button>
    </div>
    <div class="set-filters">
      <input type="search" id="setSearch" class="ps-input" placeholder="Search title, text, or ID…">
      <div class="set-filter-row">
        <select id="setFilterStatus" class="ps-input">
          <option value="all">All statuses</option>
          <option value="ready">Ready for export</option>
          <option value="no-key">Missing answer keys</option>
          <option value="not-ready">Not ready (any reason)</option>
          <option value="awaiting">Exported — awaiting CMS ID</option>
          <option value="has-id">In CMS (has ID)</option>
          <option value="draft">Drafts</option>
          <option value="approved">Approved</option>
        </select>
        <select id="setFilterGrade" class="ps-input">
          <option value="all">All grades</option>
        </select>
      </div>
      <select id="setFilterState" class="ps-input"></select>
      <div class="set-filters-meta">
        <div class="ps-hint" id="setFilterCount"></div>
        <button class="btn btn-ghost btn-compact" id="cmsExportBtn" title="Export the sets shown below as CMS import files (passages CSV, items CSV, and a JSON with the field map)">Export</button>
      </div>
    </div>
    <div class="set-list" id="setList"></div>
  </aside>
  <section class="editor-panel" id="setEditor"></section>
  <aside class="align-side" id="setSidePanel"></aside>
</main>

<main id="inputView" class="view hidden" role="tabpanel" aria-labelledby="tab-input">
  <div class="review-header">
    <div class="review-filters">
      <label class="in-lbl">State</label>
      <select id="inState" class="ps-input" style="max-width:160px"></select>
      <label class="in-lbl">Grade</label>
      <select id="inGrade" class="ps-input" style="max-width:110px"></select>
      <div class="seg" id="inStageSeg"></div>
    </div>
    <div class="review-progress" id="inputProgress"></div>
  </div>
  <div class="input-split">
    <aside class="input-list-panel" id="inputList"></aside>
    <section class="input-detail-panel" id="inputDetail"></section>
  </div>
</main>

<main id="botsView" class="view hidden" role="tabpanel" aria-labelledby="tab-bots">
  <div class="review-header">
    <div class="review-filters"><label class="in-lbl">Where to start today</label></div>
    <div class="review-progress" id="botsProgress"></div>
  </div>
  <div class="bots-split">
    <div class="bots-wrap" id="botsWrap"></div>
    <aside class="bot-cal" id="botCal"></aside>
  </div>
</main>

<main id="dashView" class="view hidden" role="tabpanel" aria-labelledby="tab-dash">
  <div class="review-header">
    <div class="review-filters">
      <label class="in-lbl">State</label>
      <select id="dashStateSeg" class="ps-input" style="max-width:180px"></select>
    </div>
    <div class="review-progress" id="dashProgress"></div>
  </div>
  <div class="dash-wrap" id="dashWrap"></div>
</main>

<div class="toast" id="toast"></div>
<div class="cmdk-backdrop hidden" id="cmdk">
  <div class="cmdk-card">
    <input type="search" id="cmdkInput" class="ps-input" placeholder="Jump to a set, view, or filter…" autocomplete="off" spellcheck="false">
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-foot"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div>
  </div>
</div>
<script src="vendor/supabase.js?v=202608272307"></script>
<script src="config.js?v=202608272307"></script>
<script src="store.js?v=202608272307"></script>
<script src="app.js?v=202608272307"></script>
</body>
</html>
